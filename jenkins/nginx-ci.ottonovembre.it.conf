server {
    listen 80;
    listen [::]:80;
    server_name ci.ottonovembre.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://ci.hexaquot.it$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ci.ottonovembre.it;

    ssl_certificate /etc/letsencrypt/live/ci.ottonovembre.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.ottonovembre.it/privkey.pem;

    location / {
        return 301 https://ci.hexaquot.it$request_uri;
    }
}
