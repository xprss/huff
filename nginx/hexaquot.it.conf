# HexaQuot production: HTTP is used only for ACME validation and HTTPS redirect.
server {
    listen 80;
    server_name hexaquot.it www.hexaquot.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://hexaquot.it$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hexaquot.it;

    ssl_certificate /etc/letsencrypt/live/hexaquot.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexaquot.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# Keep www as a supported legacy alias while making the apex the canonical URL.
server {
    listen 443 ssl http2;
    server_name www.hexaquot.it;

    ssl_certificate /etc/letsencrypt/live/hexaquot.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexaquot.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hexaquot.it$request_uri;
}

# HexaQuot staging is isolated on the existing staging application port.
