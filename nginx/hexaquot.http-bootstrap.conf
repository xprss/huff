# Temporary HTTP listener used before TLS certificates exist.  Replace this
# file with hexaquot.it.conf after both ACME certificates have been issued.
server {
    listen 80;
    server_name hexaquot.it staging.hexaquot.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
